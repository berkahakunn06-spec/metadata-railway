<script>

/* FILE LIST */

function updateFiles(){

    const files =
    document.getElementById(
    "files"
    ).files;

    document.getElementById(
    "totalFiles"
    ).innerText =
    files.length;

    let html = "";

    for(let file of files){

        html += `
        <div class="file-item">

            <span>
            ${file.name}
            </span>

            <span>
            ${(file.size/1024/1024).toFixed(2)} MB
            </span>

        </div>
        `;

    }

    document.getElementById(
    "fileList"
    ).innerHTML =
    html || "Belum ada file";

}


/* PICK FOLDER */

function pickFolder(event){

    const files =
    event.target.files;

    if(files.length > 0){

        const folder =
        files[0]
        .webkitRelativePath
        .split("/")[0];

        document.getElementById(
        "savefolder"
        ).value =
        folder;

        document.getElementById(
        "folderName"
        ).innerText =
        "📁 " + folder;

        document.getElementById(
        "saveLocation"
        ).innerText =
        folder;

    }

}


/* UPLOAD */

async function uploadFiles(){

    const files =
    document.getElementById(
    "files"
    ).files;

    const provider =
    document.getElementById(
    "provider"
    ).value;

    const apiKey =
    document.getElementById(
    "apikey"
    ).value;

    const savefolder =
    document.getElementById(
    "savefolder"
    ).value || "metadata";

    if(files.length === 0){

        alert("Pilih file dulu");
        return;

    }

    document.getElementById(
    "processingFiles"
    ).innerText =
    files.length;

    document.getElementById(
    "result"
    ).textContent =
    "⏳ Processing metadata...";

    const formData =
    new FormData();

    formData.append(
    "provider",
    provider
    );

    formData.append(
    "apiKey",
    apiKey
    );

    formData.append(
    "savefolder",
    savefolder
    );

    for(let file of files){

        formData.append(
        "files",
        file
        );

    }

    try{

        const response =
        await fetch(

        "https://repository-name-metadatachann-production-9a05.up.railway.app/upload",

        {
            method:"POST",
            body:formData
        }

        );

        const text =
        await response.text();

        console.log(text);

        let data;

        try{

            data =
            JSON.parse(text);

        }catch(parseError){

            document.getElementById(
            "result"
            ).textContent =

            "❌ SERVER ERROR\n\n" +
            text;

            return;

        }

        document.getElementById(
        "completedFiles"
        ).innerText =
        data.total || 0;

        document.getElementById(
        "processingFiles"
        ).innerText =
        0;

        document.getElementById(
        "failedFiles"
        ).innerText =
        data.failed || 0;

        let resultText = `

╔══════════════════════════════╗
🌸 MetadataChann ✨
╚══════════════════════════════╝

✅ METADATA SUCCESS

━━━━━━━━━━━━━━━━━━

📁 TOTAL FILE:
${data.total || 0}

✅ COMPLETED:
${data.total || 0}

❌ FAILED:
${data.failed || 0}

🤖 AI:
${provider}

💾 SAVE:
${savefolder}

━━━━━━━━━━━━━━━━━━

`;

        if(data.data){

            data.data.forEach(item=>{

                let keywords = [];

                if(Array.isArray(item.keywords)){

                    keywords =
                    item.keywords;

                }else{

                    keywords =
                    (item.keywords || "")
                    .split(",")
                    .map(k=>k.trim());

                }

                keywords =
                [...new Set(
                    keywords.map(
                        k=>k.toLowerCase()
                    )
                )];

                keywords =
                keywords.slice(0,49);

                resultText += `

📄 FILE:
${item.filename || "-"}

📝 TITLE:
${item.title || "-"}

🏷️ KEYWORDS:
${keywords.join(", ")}

📖 DESCRIPTION:
${item.description || "-"}

━━━━━━━━━━━━━━━━━━

`;

            });

        }

        resultText += `

🌸 Metadata generated successfully
🌸 Adobe Stock Ready

`;

        document.getElementById(
        "result"
        ).textContent =
        resultText;

    }catch(err){

        console.log(err);

        document.getElementById(
        "failedFiles"
        ).innerText =
        files.length;

        document.getElementById(
        "processingFiles"
        ).innerText =
        0;

        document.getElementById(
        "result"
        ).textContent =

        "❌ FETCH ERROR\n\n" +
        err;

    }

}


/* COPY */

function copyResult(){

    const text =
    document.getElementById(
    "result"
    ).textContent;

    navigator.clipboard
    .writeText(text);

    alert("Copied!");

}

</script>
